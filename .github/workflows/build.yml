name: Build Prisma APK
on:
  push:
    paths: ['prisma.zip', '.github/workflows/build.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: rm -rf src && mkdir src && unzip -q prisma.zip -d src && ls -la src
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Build APK
        run: cd src && gradle assembleRelease --no-daemon --stacktrace
      - name: Name APK
        run: cp src/app/build/outputs/apk/release/app-release.apk Prisma-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with: {name: 'Prisma-APK-${{ github.run_number }}', path: 'Prisma-*.apk'}
