name: Build Prisma APK
on:
  push:
    paths: ['**.zip', '.github/workflows/build.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Find and unpack zip
        run: Z=$(find . -maxdepth 3 -iname '*prisma*.zip' -not -path './.git/*' | head -1); [ -z "$Z" ] && Z=$(find . -maxdepth 3 -iname '*.zip' -not -path './.git/*' | head -1); echo "ZIP = $Z"; ls -la; [ -n "$Z" ] || { echo "::error::В репозитории нет zip-архива"; exit 1; }; rm -rf src && mkdir src && unzip -q "$Z" -d src && find src -maxdepth 3 -name settings.gradle
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Build APK
        run: P=$(dirname "$(find src -maxdepth 3 -name settings.gradle | head -1)"); echo "Project = $P"; cd "$P" && gradle assembleRelease --no-daemon --stacktrace
      - name: Name APK
        run: cp "$(find src -name '*-release.apk' | head -1)" Prisma-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with: {name: 'Prisma-APK-${{ github.run_number }}', path: 'Prisma-*.apk'}
